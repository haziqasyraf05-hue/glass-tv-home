name: Build Glass TV APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Build release APK
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          for i in 1 2 3 4 5; do
            echo "=== Percubaan $i ==="
            if [ "$i" -ge 3 ]; then
              sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip#' gradle/wrapper/gradle-wrapper.properties
            fi
            ./gradlew assembleRelease --console=plain && exit 0
            sleep 20
          done
          exit 1
      - name: Check APK
        run: |
          ls -la launcher/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: launcher/app/build/outputs/apk/release/*.apk
